<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Free AI Chatbot</title>
    <style>
        body { font-family: Arial; margin: 0; padding: 0; background: #121212; color: #fff; }
        #chat { height: 80vh; overflow-y: auto; padding: 20px; }
        .message { margin: 10px 0; padding: 10px; border-radius: 10px; }
        .user { background: #0d47a1; margin-left: 20%; }
        .ai { background: #333; margin-right: 20%; }
        input { width: 100%; padding: 15px; }
    </style>
</head>
<body>
    <h1 style="text-align:center">My Free AI</h1>
    <div id="chat"></div>
    <input type="text" id="input" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
    <script>
        async function sendMessage() {
            const input = document.getElementById('input');
            const chat = document.getElementById('chat');
            const msg = input.value.trim();
            if (!msg) return;

            chat.innerHTML += `<div class="message user">You: ${msg}</div>`;
            input.value = '';

            // Simple demo response
            setTimeout(() => {
                chat.innerHTML += `<div class="message ai">AI: Hi! I'm your free AI. What would you like to talk about?</div>`;
                chat.scrollTop = chat.scrollHeight;
            }, 500);
        }
    </script>
</body>
</html>
